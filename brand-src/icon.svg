<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 背景：深青绿，实心铺满，HA 会自己加圆角 -->
  <rect width="512" height="512" fill="#0F766E"/>

  <!-- 蒸汽：两缕琥珀色曲线 -->
  <g fill="none" stroke="#FBBF24" stroke-width="18" stroke-linecap="round">
    <path d="M206 150 C 190 120 224 106 208 72"/>
    <path d="M306 150 C 322 120 288 106 304 72"/>
  </g>

  <!-- 排气阀 -->
  <rect x="228" y="158" width="56" height="40" rx="16" fill="#CBD5E1"/>

  <!-- 锅盖（比锅身略宽） -->
  <rect x="112" y="196" width="288" height="60" rx="30" fill="#F1F5F9"/>

  <!-- 锅身 -->
  <rect x="142" y="250" width="228" height="196" rx="34" fill="#FFFFFF"/>

  <!-- 控制面板：琥珀色显示条 -->
  <rect x="206" y="310" width="100" height="22" rx="11" fill="#F59E0B"/>

  <!-- 按键 -->
  <circle cx="256" cy="392" r="18" fill="#0F766E"/>
</svg>
